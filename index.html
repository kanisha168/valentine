<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question for you?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 300px;
    }

    h1 {
      color: #ff4d6d;
    }

    p {
      font-size: 16px;
      color: #444;
    }

    .buttons {
      margin-top: 20px;
      position: relative;
      height: 60px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #ccc;
      color: #333;
      position: absolute;
      left: 120px;
    }

    #yes:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hey Mr Simar Awal 💕</h1>
    <p>
      Every day with you feels special,  
      but I was wondering…
    </p>
    <h2>Will you be my Valentine? 💌</h2>

    <div class="buttons">
      <button id="yes" onclick="yesClicked()">Yes 💖</button>
      <button id="no" onmouseover="moveNo()">No 🙃</button>
    </div>
  </div>

  <script>
    function yesClicked() {
      document.body.innerHTML = `
        <div style="text-align:center; font-family:'Segoe UI';">
          <h1 style="color:#ff4d6d;">YAYYY 💕</h1>
          <p>You just made me the happiest 🥹</p>
          <p>Happy Valentine’s Day 💘</p>
        </div>
      `;
    }

    function moveNo() {
      const button = document.getElementById("no");
      const x = Math.random() * 200;
      const y = Math.random() * 40;
      button.style.left = x + "px";
      button.style.top = y + "px";
    }
  </script>

</body>
</html>
